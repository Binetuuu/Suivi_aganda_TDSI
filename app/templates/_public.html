{% extends "base.html" %}
{% block corps %}
<div class="porte">
  <main class="porte-carte">
    <header class="porte-logo">
      <a href="/" class="porte-marque">TDSI Campus</a>
      <p>Suivi des cours · L3 TDSI · UCAD</p>
    </header>
    <div class="porte-corps">
      {% for m in messages %}<div class="flash {{ 'erreur' if m.niveau == 'erreur' }}" role="status">{{ m.message }}</div>{% endfor %}
      {% block public %}{% endblock %}
    </div>
  </main>
  <p class="porte-pied">© {{ annee }} Formation TDSI – Université Cheikh Anta Diop de Dakar</p>
</div>
{% endblock %}
{% block scripts %}<script src="/static/public.js?v={{ version_static }}"></script>{% endblock %}
