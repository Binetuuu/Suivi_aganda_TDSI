{% extends "_public.html" %}
{% block titre %}Connexion{% endblock %}
{% block public %}
<h1 class="porte-h1">Connexion</h1>
{% if erreur %}<div class="flash erreur" role="alert">{{ erreur }}</div>{% endif %}
<form method="post" action="/login" class="formulaire">
  <div class="champ">
    <label for="identifiant">Matricule ou e-mail</label>
    <input id="identifiant" name="identifiant" type="text" required autocomplete="username" value="{{ identifiant or '' }}">
  </div>
  <div class="champ">
    <label for="mot_de_passe">Mot de passe</label>
    <input id="mot_de_passe" name="mot_de_passe" type="password" required autocomplete="current-password">
    <label class="case-simple"><input type="checkbox" data-afficher="mot_de_passe"> Afficher le mot de passe</label>
  </div>
  <button class="bouton plein" type="submit">Se connecter</button>
</form>
<div class="porte-liens">
  <a href="/mot-de-passe-oublie">Mot de passe oublié ?</a>
  <a href="/activer">Première connexion : activer mon compte</a>
</div>
{% endblock %}
