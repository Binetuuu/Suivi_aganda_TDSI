{% macro icone(nom, taille=18) -%}
<svg width="{{ taille }}" height="{{ taille }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nom == 'accueil' %}<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>
{%- elif nom == 'agenda' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif nom == 'livre' %}<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>
{%- elif nom == 'cahier' %}<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>
{%- elif nom == 'qr' %}<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM21 17v4h-4"/>
{%- elif nom == 'carte' %}<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h4M14 14h3"/>
{%- elif nom == 'stats' %}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif nom == 'absence' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif nom == 'console' %}<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
{%- elif nom == 'personnes' %}<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M16 4a3.5 3.5 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/>
{%- elif nom == 'journal' %}<path d="M4 6h16M4 12h16M4 18h10"/>
{%- elif nom == 'sortie' %}<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/>
{%- elif nom == 'retour' %}<path d="M15 6l-6 6 6 6"/>
{%- elif nom == 'suivant' %}<path d="M9 6l6 6-6 6"/>
{%- elif nom == 'depot' %}<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>
{%- elif nom == 'telecharger' %}<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>
{%- elif nom == 'cadenas' %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif nom == 'utilisateur' %}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif nom == 'oeil' %}<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif nom == 'ajout' %}<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>
{%- elif nom == 'courrier' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{%- endif %}
</svg>
{%- endmacro %}

{% macro bouclier(taille=360) -%}
<svg class="bouclier" width="{{ taille }}" height="{{ taille }}" viewBox="0 0 400 400" role="img" aria-label="Bouclier de sécurité">
  <defs>
    <linearGradient id="g-bouclier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6BFF"/><stop offset="1" stop-color="#1B3FA8"/>
    </linearGradient>
    <radialGradient id="g-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B6BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#3B6BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#g-halo)"/>
  <g class="orbite lente" fill="none" stroke="#7FA2FF" stroke-opacity="0.35">
    <circle cx="200" cy="200" r="168" stroke-dasharray="2 10"/>
    <circle cx="368" cy="200" r="5" fill="#7FA2FF" stroke="none"/>
    <circle cx="32" cy="200" r="3.5" fill="#F5A35C" stroke="none"/>
  </g>
  <g class="orbite" fill="none" stroke="#7FA2FF" stroke-opacity="0.25">
    <circle cx="200" cy="200" r="130"/>
    <circle cx="200" cy="70" r="4" fill="#A8C0FF" stroke="none"/>
    <circle cx="292" cy="292" r="3" fill="#7FA2FF" stroke="none"/>
  </g>
  <path d="M200 92 L278 122 V196 C278 246 244 284 200 302 C156 284 122 246 122 196 V122 Z" fill="url(#g-bouclier)" stroke="#A8C0FF" stroke-width="2"/>
  <path d="M200 112 L262 136 V196 C262 236 236 266 200 282" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="174" y="186" width="52" height="42" rx="8" fill="#0B1424"/>
  <path d="M184 186 V172 a16 16 0 0 1 32 0 V186" fill="none" stroke="#0B1424" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="203" r="6" fill="#F5A35C"/>
  <rect x="197.5" y="206" width="5" height="12" rx="2" fill="#F5A35C"/>
</svg>
{%- endmacro %}

{% macro marque(taille=40) -%}
<span class="logo-marque" style="width:{{ taille }}px;height:{{ taille }}px;flex-basis:{{ taille }}px" aria-hidden="true">
<svg viewBox="0 0 100 100" width="{{ (taille * 0.66) | int }}" height="{{ (taille * 0.66) | int }}"><path d="M29 25 50 15 71 25 70 54 61 71 50 79 39 71 30 54Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><path d="M39 47 48 56 63 39" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</span>
{%- endmacro %}
